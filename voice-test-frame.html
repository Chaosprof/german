<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>voice test frame</title>
<style>
  body { margin: 0; background: #0b0e13; color: #7fd0ff;
         font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 6px 8px; }
</style>
</head>
<body>
frame
<script>
// Stands in for berlin-runner.html?embed=1: same origin, same nesting, spoken
// from a message handler rather than a tap - exactly like a cleared gate.
(function () {
  var held = [];
  function report(msg) {
    try { parent.postMessage({ from: 'voice-frame', msg: msg }, '*'); } catch (e) {}
    document.body.appendChild(document.createTextNode('\n' + msg));
  }

  function germanVoice(win) {
    var vs = [];
    try { vs = win.speechSynthesis.getVoices() || []; } catch (e) { return null; }
    var best = null;
    for (var i = 0; i < vs.length; i++) {
      var lang = String(vs[i].lang || '').toLowerCase().replace('_', '-');
      if (lang.indexOf('de') !== 0) continue;
      if (!best || (lang === 'de-de' && String(best.lang).toLowerCase() !== 'de-de')) best = vs[i];
    }
    return best;
  }

  // win is the window whose speech engine and realm are used. For the
  // through-the-parent test the utterance MUST be built with the parent's
  // constructor, or it belongs to the wrong document.
  function speakWith(win, label) {
    var u;
    try { u = new win.SpeechSynthesisUtterance('der Bahnhof'); }
    catch (e) { report(label + ': constructor threw - ' + e); return; }
    var voice = germanVoice(win);
    u.lang = (voice && voice.lang) || 'de-DE';
    if (voice) u.voice = voice;
    u.pitch = 0.78; u.rate = 0.86; u.volume = 1;
    var fired = false;
    u.onstart = function () { fired = true; report(label + ': onstart'); };
    u.onend = function () { report(label + ': onend'); };
    u.onerror = function (e) { report(label + ': ONERROR ' + ((e && e.error) || '?')); };
    held.push(u);
    report(label + ': speak() voice=' + (voice ? voice.name : 'none, lang only'));
    try { win.speechSynthesis.speak(u); }
    catch (e) { report(label + ': speak() threw - ' + e); return; }
    setTimeout(function () {
      if (!fired) report(label + ': NO EVENT after 1.2s - dropped');
      try {
        var s = win.speechSynthesis;
        report(label + ': state speaking=' + s.speaking + ' pending=' + s.pending + ' paused=' + s.paused);
      } catch (e) {}
    }, 1200);
  }

  // The game's frame is not a bare document: it runs Web Audio and WebGL of
  // its own. Every frame test so far ran in silence, so this is the untested
  // combination - speech in a frame that owns an audio context.
  var primed = false, audio = null;
  function ensurePrimed(cb) {
    if (primed) { cb(); return; }
    primed = true;
    try {
      var w = new SpeechSynthesisUtterance('de');
      w.volume = 0; w.lang = 'de-DE';
      held.push(w);
      window.speechSynthesis.speak(w);
      report('frame primed (warm-up)');
    } catch (e) { report('frame priming threw - ' + e); }
    setTimeout(cb, 600);
  }
  function startAudio() {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) { report('no Web Audio in the frame'); return null; }
    if (!audio) { audio = new Ctor(); report('frame AudioContext created, state=' + audio.state); }
    if (audio.state === 'suspended') audio.resume();
    try {
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 330;
      g.gain.value = 0.0001;
      g.gain.exponentialRampToValueAtTime(0.2, audio.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.45);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.5);
      report('frame beep played, state=' + audio.state);
    } catch (e) { report('frame beep threw - ' + e); }
    return audio;
  }

  // Sound without pause, the way the game makes it.
  var loopSrc = null, loopGain = null, rumble = null;
  function startContinuous() {
    var ctx = startAudio();
    if (!ctx || loopSrc) return;
    try {
      var buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      loopSrc = ctx.createBufferSource();
      loopSrc.buffer = buf; loopSrc.loop = true;
      var band = ctx.createBiquadFilter();
      band.type = 'bandpass'; band.frequency.value = 620; band.Q.value = 0.5;
      loopGain = ctx.createGain(); loopGain.gain.value = 0.06;
      loopSrc.connect(band); band.connect(loopGain); loopGain.connect(ctx.destination);
      loopSrc.start();
      rumble = ctx.createOscillator();
      var rg = ctx.createGain();
      rumble.frequency.value = 42; rg.gain.value = 0.05;
      rumble.connect(rg); rg.connect(ctx.destination);
      rumble.start();
      report('continuous city bed + rumble started, state=' + ctx.state);
    } catch (e) { report('continuous audio threw - ' + e); }
  }
  function stopContinuous() {
    try { if (loopSrc) loopSrc.stop(); } catch (e) {}
    try { if (rumble) rumble.stop(); } catch (e) {}
    loopSrc = rumble = null;
    report('continuous audio stopped');
  }

  window.addEventListener('message', function (e) {
    var cmd = e.data && e.data.cmd;
    if (cmd === 'self') {
      speakWith(window, '9 iframe speaks itself');
    } else if (cmd === 'parent') {
      try { speakWith(window.parent, '10 iframe via parent'); }
      catch (err) { report('10: reaching the parent threw - ' + err); }
    } else if (cmd === 'prime') {
      // The game primes inside the first gesture; here the tap happened in the
      // parent, so this is the harder case on purpose.
      try {
        var warm = new SpeechSynthesisUtterance('de');
        warm.volume = 0; warm.lang = 'de-DE';
        held.push(warm);
        window.speechSynthesis.speak(warm);
        report('11: primed inside the frame');
      } catch (err) { report('11: priming threw - ' + err); }
      setTimeout(function () { speakWith(window, '11 iframe after priming'); }, 500);
    } else if (cmd === 'audio-self') {
      ensurePrimed(function () {
        startAudio();
        setTimeout(function () { speakWith(window, '12 frame audio + frame speech'); }, 600);
      });
    } else if (cmd === 'audio-parent') {
      ensurePrimed(function () {
        startAudio();
        setTimeout(function () {
          try { speakWith(window.parent, '13 frame audio + parent speech'); }
          catch (err) { report('13: reaching the parent threw - ' + err); }
        }, 600);
      });
    } else if (cmd === 'audio-suspend') {
      ensurePrimed(function () {
        startAudio();
        setTimeout(function () {
          if (!audio) { speakWith(window, '14 frame speech (no audio context)'); return; }
          audio.suspend().then(function () {
            report('frame audio suspended, state=' + audio.state);
            speakWith(window, '14 audio suspended + frame speech');
          }, function (err) {
            report('14: suspend failed - ' + err);
            speakWith(window, '14 audio suspended + frame speech');
          });
        }, 600);
      });
    } else if (cmd === 'loud-self') {
      // The game does not play a beep and stop: a looping noise buffer and a
      // rumble oscillator run from the first gesture to the end of the run.
      // This is that, and it is the one condition never tested so far.
      ensurePrimed(function () {
        startContinuous();
        setTimeout(function () { speakWith(window, '15 continuous audio + frame speech'); }, 700);
      });
    } else if (cmd === 'loud-park') {
      ensurePrimed(function () {
        startContinuous();
        setTimeout(function () {
          if (!audio) { speakWith(window, '16 frame speech'); return; }
          audio.suspend().then(function () {
            report('continuous audio parked, state=' + audio.state);
            speakWith(window, '16 continuous audio parked + frame speech');
            setTimeout(function () {
              audio.resume();
              report('continuous audio resumed, state=' + audio.state);
            }, 2500);
          }, function (err) { report('16: suspend failed - ' + err); });
        }, 700);
      });
    } else if (cmd === 'quiet') {
      stopContinuous();
    } else if (cmd === 'env') {
      var own = -1, par = '-';
      try { own = (window.speechSynthesis.getVoices() || []).length; } catch (err) { own = 'threw'; }
      try { par = (window.parent.speechSynthesis.getVoices() || []).length; } catch (err) { par = 'BLOCKED'; }
      report('frame env: own voices=' + own + ', parent voices=' + par +
             ', same-origin parent=' + (par !== 'BLOCKED'));
    }
  });

  report('frame ready');
})();
</script>
</body>
</html>
